name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        python: ['3.11', '3.14']
    defaults:
      run:
        shell: bash
    env:
      PROJECT_PYTHON: ${{ matrix.os == 'windows-latest' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}
      PROJECT_PIP: ${{ matrix.os == 'windows-latest' && '.venv/Scripts/pip.exe' || '.venv/bin/pip' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create environment and install
        run: |
          python -m venv .venv
          "$PROJECT_PIP" install -e '.[test]'
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: '"$PROJECT_PYTHON" -m playwright install-deps chromium'
      - name: Install Chromium
        run: '"$PROJECT_PYTHON" -m playwright install chromium'
      - name: Run tests
        run: '"$PROJECT_PYTHON" -m pytest -q'
